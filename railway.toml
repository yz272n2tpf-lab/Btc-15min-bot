# Isolated clean prospective ladder collector only.
[build]
builder = "railpack"

[deploy]
startCommand = "python -m unittest -q test_scalp_move_finalprod_clean_static.py && exec env SCALP_COLLECTOR_SCRIPT=scalp_move_shadow_v2_finalprod_clean.py python -u scalp_path_export_bridge_v1.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
