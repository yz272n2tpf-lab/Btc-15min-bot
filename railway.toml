# Isolated clean prospective ladder collector only.
[build]
builder = "railpack"

[deploy]
startCommand = "python -m unittest -q test_scalp_move_finalprod_clean_static.py test_brti_consumer_contract_v2.py test_btc15_clean_run.py test_btc15_common_observer.py test_btc15_clean_frame_freshness.py && exec python -u btc15_clean_run_v1.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
