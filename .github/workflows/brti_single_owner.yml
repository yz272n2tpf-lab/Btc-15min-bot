name: Shared BRTI consumer migration
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python -m unittest test_brti_single_owner_consumers test_v81_entry_event_metadata -v
