name: BTC15 Isolated Staged Lifecycle Repair

on:
  push:
    branches:
      - diag/rollover-staged-snapshot-check-20260922

permissions:
  contents: write

jobs:
  verify-minimal-repair:
    if: github.ref == 'refs/heads/diag/rollover-staged-snapshot-check-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: b9e8fbd56988c7b86859e4d942862399186fb90e
      TARGET: fix/rollover-staged-snapshot-v1-20260922
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove original selector fails the observed boundary lifecycle
        run: |
          test "$(git hash-object bot_two_output_build_v4_13_profit_protection_shadow.py)" = fc5e7bb511a35b4ee7db87381cd0d66991d1d48f
          test "$(git hash-object btc15_rollover_production_canary_v1.py)" = 41caa04a92b53a10a941e318e195fe85fbf4163c
          python - <<'PY'
          import unittest
          name = 'test_btc15_rollover_staged_lifecycle_v1.StagedLifecycleTests.test_boundary_handoff_survives_next_future_observation'
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromName(name))
          assert result.testsRun == 1 and len(result.failures) == 1 and not result.errors, 'Expected exactly the reproduced pre-fix assertion failure'
          print('BASELINE DEFECT REPRODUCED: PASS (expected original-code failure)')
          PY
      - name: Move only the existing eligible snapshot before observe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot_two_output_build_v4_13_profit_protection_shadow.py')
          s = p.read_text()
          assignment = '    _staged = rollover_canary.eligible(now)\n'
          observe = '    rollover_canary.observe(kalshi_get, parse_dt, now)\n'
          assert s.count(assignment) == 1 and s.count(observe) == 1
          s = s.replace(assignment, '').replace(observe, '    # Capture the opening candidate before observe stages the next future contract.\n' + assignment + observe)
          p.write_text(s)
          PY
          git diff --check
          git diff -- bot_two_output_build_v4_13_profit_protection_shadow.py
      - name: Run new lifecycle, original handoff, and existing regression suites
        run: |
          python -m py_compile bot_two_output_build_v4_13_profit_protection_shadow.py btc15_rollover_production_canary_v1.py test_btc15_rollover_staged_lifecycle_v1.py
          python -m unittest -v test_btc15_rollover_staged_lifecycle_v1.py test_btc15_rollover_staged_handoff_prod_v1.py test_btc15_rollover_diag_v1.py test_btc15_kalshi_quote_provenance_regressions.py test_btc15_parity_measurement_regressions.py
          python test_btc15_dashboard_parity_ws_static.py
      - name: Publish one clean correction commit to an isolated fix branch only
        run: |
          git show "$BASE:.github/workflows/rollover_diag_tests.yml" > .github/workflows/rollover_diag_tests.yml
          python - <<'PY'
          import os, subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE']], text=True).splitlines())
          allowed = {'bot_two_output_build_v4_13_profit_protection_shadow.py', 'test_btc15_rollover_staged_lifecycle_v1.py'}
          assert changed == allowed, ('Unexpected final scope', changed)
          print('FINAL SCOPE: only rollover snapshot ordering and its new offline tests')
          print('Protected logic, canary, quote plumbing, timing cadence, configuration and workflows: unchanged from BASE')
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test -z "$(git ls-remote origin "refs/heads/$TARGET")"
          git add bot_two_output_build_v4_13_profit_protection_shadow.py test_btc15_rollover_staged_lifecycle_v1.py .github/workflows/rollover_diag_tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'fix: snapshot eligible rollover candidate before staging refresh' '' 'Proven by baseline lifecycle failure, 17 new lifecycle regressions, original handoff tests and existing regression suite. Production main is not changed or deployed.' | git commit-tree "$TREE" -p "$BASE")
          git push origin "$COMMIT:refs/heads/$TARGET"
          echo "CORRECTION_BRANCH=$TARGET"
          echo "CORRECTION_COMMIT=$COMMIT"
          echo "CORRECTION_TREE=$TREE"
          echo 'PRODUCTION MAIN AND RAILWAY UNTOUCHED'
