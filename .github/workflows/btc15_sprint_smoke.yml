name: BTC15 seven-day sprint nonproduction smoke
on:
  push:
    branches: ['qualification/seven-day-sprint-20260929']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BTC15_REQUIRE_SOCKET_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt -r round2_evidence/test_requirements.txt
      - name: Focused recovery only; preserved 257-test run is not repeated
        run: python -B -m sprint_evidence.run_recovery_qualification
      - name: Preserve all smoke evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15-sprint-nonproduction-smoke
          path: hosted_recovery/
          retention-days: 14
