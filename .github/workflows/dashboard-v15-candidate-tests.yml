name: Dashboard V15 responsive candidate tests

on:
  push:
    branches: [scalp-ui-state-contract-v1]
    paths:
      - 'BTC15_DASHBOARD_COMBINED_SCALP_UI_V15.py'
      - 'BTC15_DASHBOARD_DOM_STRUCTURE_REPORT_V15.py'
      - 'BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.py'
      - 'BTC15_DASHBOARD_V15_VIEWPORT_CONTRACT.md'
      - 'btc15_mobile_dashboard_view_model_v1.py'
      - 'btc15_mobile_dashboard_view_model_v2.py'
      - 'btc15_mobile_dashboard_view_model_v3.py'
      - 'btc15_mobile_dashboard_view_model_v4.py'
      - 'btc15_time_left_guardrail_v1.py'
      - 'btc15_dashboard_rollover_guard_v1.py'
      - 'btc15_scalp_memory_guard_v1.py'
      - 'btc15_scalp_ui_state_fixtures_v1.py'
      - 'test_BTC15_DASHBOARD_COMBINED_SCALP_UI_V15.py'
      - 'test_BTC15_DASHBOARD_PRESENTATION_AUDIT_V15.py'
      - 'test_BTC15_DASHBOARD_DOM_STRUCTURE_V15.py'
      - 'test_BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.py'
      - 'test_btc15_mobile_dashboard_view_model_v2.py'
      - 'test_btc15_mobile_dashboard_view_model_v3.py'
      - 'test_btc15_mobile_dashboard_view_model_v4.py'
      - 'test_btc15_time_left_guardrail_v1.py'
      - 'test_btc15_dashboard_rollover_guard_v1.py'
      - 'test_btc15_scalp_memory_guard_v1.py'
      - 'BTC15_DASHBOARD_V15_RESPONSIVE_CANDIDATE_FREEZE.md'
      - '.github/workflows/dashboard-v15-candidate-tests.yml'
  pull_request:
    paths:
      - 'BTC15_DASHBOARD_COMBINED_SCALP_UI_V15.py'
      - 'BTC15_DASHBOARD_DOM_STRUCTURE_REPORT_V15.py'
      - 'BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.py'
      - 'BTC15_DASHBOARD_V15_VIEWPORT_CONTRACT.md'
      - 'btc15_mobile_dashboard_view_model_v1.py'
      - 'btc15_mobile_dashboard_view_model_v2.py'
      - 'btc15_mobile_dashboard_view_model_v3.py'
      - 'btc15_mobile_dashboard_view_model_v4.py'
      - 'btc15_time_left_guardrail_v1.py'
      - 'btc15_dashboard_rollover_guard_v1.py'
      - 'btc15_scalp_memory_guard_v1.py'
      - 'btc15_scalp_ui_state_fixtures_v1.py'
      - 'test_BTC15_DASHBOARD_COMBINED_SCALP_UI_V15.py'
      - 'test_BTC15_DASHBOARD_PRESENTATION_AUDIT_V15.py'
      - 'test_BTC15_DASHBOARD_DOM_STRUCTURE_V15.py'
      - 'test_BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.py'
      - 'test_btc15_mobile_dashboard_view_model_v2.py'
      - 'test_btc15_mobile_dashboard_view_model_v3.py'
      - 'test_btc15_mobile_dashboard_view_model_v4.py'
      - 'test_btc15_time_left_guardrail_v1.py'
      - 'test_btc15_dashboard_rollover_guard_v1.py'
      - 'test_btc15_scalp_memory_guard_v1.py'
      - 'BTC15_DASHBOARD_V15_RESPONSIVE_CANDIDATE_FREEZE.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prove inherited V14 still passes
        run: |
          python -m unittest -v test_BTC15_DASHBOARD_COMBINED_SCALP_UI_V14.py
          python -m unittest -v test_BTC15_DASHBOARD_PRESENTATION_AUDIT_V14.py
      - name: Capture current generated DOM structure
        run: python BTC15_DASHBOARD_DOM_STRUCTURE_REPORT_V15.py > v15_dom_structure.json
      - name: Upload generated DOM structure
        uses: actions/upload-artifact@v4
        with:
          name: v15-dom-structure
          path: v15_dom_structure.json
          retention-days: 3
      - name: Prove current DOM can accept guarded V15 layout
        run: python -m unittest -v test_BTC15_DASHBOARD_DOM_STRUCTURE_V15.py
      - name: Test V15 responsive candidate
        run: |
          python -m unittest -v test_BTC15_DASHBOARD_COMBINED_SCALP_UI_V15.py
          python -m unittest -v test_BTC15_DASHBOARD_PRESENTATION_AUDIT_V15.py
          python BTC15_DASHBOARD_COMBINED_SCALP_UI_V15.py --self-test
      - name: Test offline phone/tablet fixture preview
        run: |
          python -m unittest -v test_btc15_time_left_guardrail_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v2.py
          python -m unittest -v test_btc15_dashboard_rollover_guard_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v3.py
          python -m unittest -v test_btc15_scalp_memory_guard_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v4.py
          python -m unittest -v test_BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.py
          python BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.py
          cp /tmp/BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.html ./BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.html
      - name: Upload offline fixture preview
        uses: actions/upload-artifact@v4
        with:
          name: v15-offline-fixture-preview
          path: BTC15_DASHBOARD_V15_FIXTURE_PREVIEW.html
          retention-days: 3
