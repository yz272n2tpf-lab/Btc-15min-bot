name: BTC15 signal-only completion regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline regressions including real local owner HTTP and consumers
        run: python -m unittest discover -p 'test*.py' -v 2>&1 | tee root-tests.log
      - name: Preserved audit and rejection evidence
        run: python -m unittest discover -s completion_audit -p 'test*.py' -v 2>&1 | tee audit-tests.log
      - name: Packaged runtime path and authority gates
        run: |
          python test_btc15_canary_data_path_static.py
          python test_btc15_dashboard_parity_ws_static.py
          python test_brti_main_cutover_static_gate_v1.py
      - name: Assembled process tree and resource contention
        run: python completion_audit/qualify_information_topology.py --duration 30 --output topology-resources.json 2>&1 | tee topology-resources.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: |
          npm install --prefix /tmp/btc15-browser --no-audit --no-fund playwright@1.62.1
          /tmp/btc15-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser on assembled production HTML
        env:
          NODE_PATH: /tmp/btc15-browser/node_modules
        run: node completion_audit/information_browser_test.cjs 2>&1 | tee browser-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-clock-integration-evidence
          path: |
            root-tests.log
            audit-tests.log
            topology-resources.json
            topology-resources.log
            browser-results.log
