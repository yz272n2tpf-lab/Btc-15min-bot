name: EARLY integrated lifecycle verification
on:
  push:
    branches:
      - fix/btc15-early-directional-lifecycle-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check btc15_v2_product/panel.js
      - run: node --check cockpit_candidate/adapter.js
      - run: node --check cockpit_candidate/trade_records.js
      - run: sha256sum -c hosting/runtime.sha256 && python3 -m py_compile server.py
        working-directory: cockpit_candidate
      - run: node cockpit_candidate/test_trade_records.cjs
      - run: node cockpit_candidate/test_source_display.cjs
      - run: python -m py_compile verify_btc15_main_live_checkpoint_readonly.py
      - run: python prepare_btc15_early_release_review.py
      - run: python verify_btc15_early_release_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: early-main-release-review
          path: qualification/early-release-review
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_btc15_supported_early test_early_three_signal_display_v1 test_directional_position_manager_v1 test_btc15_trade_clarity test_btc15_early_cockpit_display
