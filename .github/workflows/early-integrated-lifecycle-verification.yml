name: EARLY integrated lifecycle verification
on:
  push:
    branches:
      - fix/btc15-early-directional-lifecycle-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_btc15_supported_early test_early_three_signal_display_v1 test_directional_position_manager_v1 test_btc15_trade_clarity
