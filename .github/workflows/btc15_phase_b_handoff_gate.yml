name: BTC15 Phase B handoff and cockpit gate
on:
  pull_request:
    paths:
      - 'btc15_v2_product/early_origin_transfer.py'
      - 'test_btc15_handoff_history_regression.py'
      - 'verify_btc15_handoff_snapshot_gate.py'
      - '.github/workflows/btc15_phase_b_handoff_gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Handoff regression and EARLY lifecycle
        run: python -m unittest -v test_btc15_handoff_history_regression test_btc15_supported_early test_early_three_signal_display_v1 test_directional_position_manager_v1 test_btc15_trade_clarity test_btc15_early_cockpit_display
      - name: Cockpit signal and trade-record tests
        run: |
          node cockpit_candidate/test_trade_records.cjs
          node cockpit_candidate/test_source_display.cjs
          node cockpit_candidate/test_explanation_stability.cjs
          node cockpit_candidate/test_final_retention.cjs
      - name: Verify historical snapshot gate syntax
        run: python -m py_compile verify_btc15_handoff_snapshot_gate.py
# This CI gate is offline only. Real private SQLite snapshot verification
# was performed separately in Codespaces and cannot run in GitHub Actions.
