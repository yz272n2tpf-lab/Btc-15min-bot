name: PR40 acceptance scorer proof
on:
  pull_request:
    paths:
      - btc15_acceptance_score_v1.py
      - .github/workflows/pr40-acceptance-proof.yml
jobs:
  scorer-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove CLI calls scorer exactly
        run: |
          python - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          ticker='KXBTC15M-TEST'
          row={'schema':'BTC15_COHORT_NATIVE_V1','timestamp_utc':'2026-09-26T16:00:00+00:00','contract':ticker,'target':100000,'seconds_left':0,'signal_only':True,'orders':False,'final_status':'PASS','early':{'provisional_candidate':False},'unified_row_count':1,'true_scalp_pending':0,'profit_pending':0,'brti':{'contract':ticker,'target':100000,'final60_complete':True,'final60_count':60,'final60_average':99999,'final60_side':'DOWN'}}
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)/'j.jsonl'; p.write_text(json.dumps(row)+'\n')
              out=subprocess.check_output(['python','btc15_acceptance_score_v1.py','--journal',str(p),'--ticker',ticker,'--target','100000'],text=True)
              got=json.loads(out)
              assert got['status']=='COMPLETE' and got['missing']==[]
          PY
