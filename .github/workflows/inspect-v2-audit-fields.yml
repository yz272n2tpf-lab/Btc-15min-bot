name: Inspect V2 candidate-time audit fields

on:
  push:
    branches: [scalp-false-start-development-20260920]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect live V2 audit schema
        run: |
          python - <<'PY'
          import json,urllib.request,collections
          base='https://scalp-nextgen-shadow-v2-production.up.railway.app'
          with urllib.request.urlopen(base+'/state',timeout=20) as r: state=json.load(r)
          with urllib.request.urlopen(base+'/audit',timeout=20) as r: audit=json.load(r)
          print('STATE_COUNTS',json.dumps({
            'future_full_contracts':state.get('future_full_contracts'),
            'serial_signals':state.get('serial_signals'),
            'status':state.get('status'),
            'code_sha256':state.get('code_sha256'),
          },sort_keys=True))
          recs=audit.get('audit_records') or {}
          for fam,lanes in recs.items():
              for lane,rows in lanes.items():
                  keys=collections.Counter()
                  for x in rows[:50]: keys.update(x.keys())
                  print('AUDIT_SCHEMA',json.dumps({
                    'family':fam,'lane':lane,'rows':len(rows),
                    'keys':sorted(keys),
                    'sample':rows[0] if rows else None
                  },sort_keys=True))
                  break
          PY
      - name: Probe current raw source export without credentials
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,csv,io,json
          u='https://scalp-move-shadow-v1-production.up.railway.app/research/path-export'
          try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  raw=r.read()
                  print('RAW_SOURCE_HTTP',r.status)
                  print('RAW_SOURCE_BYTES',len(raw))
                  text=raw.decode('utf-8','replace')
                  rows=list(csv.DictReader(io.StringIO(text)))
                  print('RAW_SOURCE_META',json.dumps({'rows':len(rows),'header':list(rows[0].keys()) if rows else []}))
          except urllib.error.HTTPError as e:
              print('RAW_SOURCE_HTTP',e.code)
          PY

