name: BTC15 decisive capture writer throughput gate
on:
  push:
    branches: ['qualification/capture-writer-throughput-20260930']
permissions:
  contents: read
jobs:
  decisive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m capture2.test_writer_pipeline
      - run: >-
          python -B -m unittest -v
          capture2.test_composition.CompositionTests.test_composed_native_tree_preserves_every_original_statement
          capture2.test_composition.CompositionTests.test_protected_assembly_preserves_original_strategy_ast
          capture2.test_composition.CompositionTests.test_v81_original_statements_preserved
          capture2.test_composition.CompositionTests.test_composed_quote_session_off_on_exact_same_source_operations
      - run: python -B -m capture2.test_writer_pipeline --sustained main
      - run: python -B -m capture2.test_writer_pipeline --sustained v81
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-writer-throughput-results
          path: capture_writer/results/*.json
