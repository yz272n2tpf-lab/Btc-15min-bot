name: Clean collector durable source integrity
on:
  pull_request:
    branches: [scalp-finalprod-clean-v1-20260920]
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_scalp_move_finalprod_clean_static.py test_brti_consumer_contract_v2.py test_btc15_clean_run.py test_btc15_common_observer.py test_btc15_clean_frame_freshness.py
