name: BTC15 recorder burst correction research
on:
  push:
    branches: [research/main-closeout-incremental-20261015]
    paths:
      - 'ops/live_recording/burst_journal_research.py'
      - 'ops/live_recording/capture.py'
      - 'ops/recording_workflow/evidence.py'
      - 'ops/live_recording/quote_window_handoff_research.py'
      - 'ops/live_recording/native_window_handoff_research.py'
      - 'research/main_closeout_incremental_20261015/test_native_journal_window_handoff.py'
      - 'ops/live_recording/source_contract_window_handoff_research.py'
      - 'research/main_closeout_incremental_20261015/test_source_contract_window_handoff.py'
      - 'ops/live_recording/v81_window_associations_research.py'
      - 'research/main_closeout_incremental_20261015/test_v81_exact_native_window_causality.py'
      - 'research/main_closeout_incremental_20261015/test_quote_window_handoff_research.py'
      - 'research/main_closeout_incremental_20261015/test_existing_reader_window_inventory.py'
      - 'research/main_closeout_incremental_20261015/test_recorder_burst_batch_research.py'
      - '.github/workflows/btc15-recorder-burst-research.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RAILWAY_DEPLOYMENT_ID: OFFLINE
      KALSHI_KEY_ID: ''
      KALSHI_PRIVATE_KEY_B64: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run targeted recorder queue, seal, hash chain regressions
        run: python -m unittest -v research.main_closeout_incremental_20261015.test_recorder_burst_batch_research
      - name: Verify existing reader's bounded source inventory
        run: python -m unittest -v research.main_closeout_incremental_20261015.test_existing_reader_window_inventory
      - name: Verify bounded quote state across original windows
        run: python -m unittest -v research.main_closeout_incremental_20261015.test_quote_window_handoff_research
      - name: Verify bounded original native journal lifecycles
        run: python -m unittest -v research.main_closeout_incremental_20261015.test_native_journal_window_handoff
      - name: Verify exact original source, official contract and settlement handoffs
        run: python -m unittest -v research.main_closeout_incremental_20261015.test_source_contract_window_handoff
      - name: Verify original V81 native INPUT and exact BTC BRTI book causality
        run: python -m unittest -v research.main_closeout_incremental_20261015.test_v81_exact_native_window_causality