name: SCALP Pullback After Move Audit

on:
  push:
    branches:
      - scalp-pullback-entry-audit-20260920
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen scalp audit
        run: python BTC15_SCALP_PULLBACK_AFTER_MOVE_AUDIT_V1.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scalp-pullback-after-move-v1-report
          path: scalp_pullback_after_move_v1_report.json
