name: EARLY Preprice LeadLag Audit

on:
  push:
    branches:
      - early-subminute-preprice-audit-20260920
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen historical audit
        run: python BTC15_EARLY_PREPRICE_LEADLAG_AUDIT_V1.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: early-preprice-leadlag-v1-report
          path: early_preprice_leadlag_v1_report.json
