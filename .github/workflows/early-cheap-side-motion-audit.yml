name: EARLY Cheap Side Motion Audit

on:
  push:
    branches:
      - early-cheap-side-motion-v1-20260920
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen historical audit
        run: python BTC15_EARLY_CHEAP_SIDE_MOTION_AUDIT_V1.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: early-cheap-side-motion-v1-report
          path: early_cheap_side_motion_v1_report.json
