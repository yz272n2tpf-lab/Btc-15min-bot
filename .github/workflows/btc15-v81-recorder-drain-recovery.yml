name: BTC15 V81 recorder drain recovery (offline only)
on:
  push:
    branches:
      - research/btc15-v81-incomplete-drain-recovery-20261014
    paths:
      - .github/workflows/btc15-v81-recorder-drain-recovery.yml
      - ops/live_recording/capture.py
      - test_btc15_v81_recorder_drain_recovery.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-recorder-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and offline regressions only
        run: |
          python -m py_compile ops/live_recording/capture.py test_btc15_v81_recorder_drain_recovery.py
          python -m unittest -v test_btc15_v81_recorder_drain_recovery test_btc15_quote_proof_offpath_v1
