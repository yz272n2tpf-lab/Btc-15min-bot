name: BTC15 V11 isolated outbox real-worker bridge
on:
  push:
    branches: [research/main-closeout-incremental-20261015]
    paths:
      - 'research/main_closeout_incremental_20261015/btc15_v11_outbox_actual_worker_bridge_research.py'
      - 'research/main_closeout_incremental_20261015/test_v11_outbox_actual_worker_bridge.py'
      - '.github/workflows/btc15-v11-outbox-real-worker.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_DEPLOYMENT_ID: OFFLINE
      KALSHI_KEY_ID: ""
      KALSHI_PRIVATE_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V11 outbox actual-worker integration
        run: python -m unittest -v research.main_closeout_incremental_20261015.test_v11_outbox_actual_worker_bridge
