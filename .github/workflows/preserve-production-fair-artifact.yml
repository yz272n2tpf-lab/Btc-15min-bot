name: Preserve production fair artifact

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/preserve-production-fair-artifact.yml']

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - run: python completion_audit/verify_frozen_model_candidate.py
      - name: Require registered artifact identity
        run: |
          test "$(sha256sum completion_audit/model_artifact/frozen_fair_candidate.joblib | cut -d' ' -f1)" = "1bf10e755fc81584bab3c3682b16103353f84582c27bb003664de883e7e7c816"
          grep -q '95fc4e893c9032f29b9732d03c4a2e0cd62755ba93b36106a1d0c8c094520ba6' completion_audit/model_artifact/manifest.json
      - name: Commit exact binary artifact
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add completion_audit/model_artifact/frozen_fair_candidate.joblib completion_audit/model_artifact/manifest.json
          git commit -m "Preserve verified production fair artifact"
          git push origin HEAD:${{ github.head_ref }}
