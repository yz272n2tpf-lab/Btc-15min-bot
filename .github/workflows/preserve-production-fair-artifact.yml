name: Preserve production fair artifact

on:
  push:
    branches: [release/btc15-integrity-20260923]
    paths: ['.github/workflows/preserve-production-fair-artifact.yml']

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - run: python completion_audit/verify_frozen_model_candidate.py
      - name: Require registered artifact identity
        run: |
          test "$(sha256sum completion_audit/model_artifact/frozen_fair_candidate.joblib | cut -d' ' -f1)" = "2973e4e44d9a0212d3efc443d58956073ba8209cf340fd5d6730c462ab7534c6"
          grep -q '4cdb63db4e2b977592f158147cab650c861c683bf1218556878463120dafeee2' completion_audit/model_artifact/manifest.json
      - name: Commit exact binary artifact
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add completion_audit/model_artifact/frozen_fair_candidate.joblib completion_audit/model_artifact/manifest.json
          git commit -m "Preserve verified production fair artifact"
          git push origin HEAD:${GITHUB_REF_NAME}
