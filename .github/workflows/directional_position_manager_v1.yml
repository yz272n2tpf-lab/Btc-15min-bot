name: BTC15 Directional Position Manager V1
on:
  push:
    branches: [shadow/directional-position-manager-v1-20260921]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m py_compile btc15_directional_position_manager_v1.py test_btc15_directional_position_manager_v1.py btc15_dashboard_state_contract_v1.py test_btc15_dashboard_state_contract_v1.py
      - run: python -m unittest -v test_btc15_directional_position_manager_v1.py test_btc15_dashboard_state_contract_v1.py test_btc15_directional_manager_shadow_bridge_v1.py test_btc15_signal_integration_v1.py test_btc15_main_protected_state_adapter_v1.py
      - name: NO ORDERS guard
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path("btc15_directional_position_manager_v1.py").read_text().lower()
          banned=["create_order","place_order","/orders"]
          found=[x for x in banned if x in t]
          if found: raise SystemExit("order action found: "+",".join(found))
          print("NO ORDERS: PASS")
          PY
