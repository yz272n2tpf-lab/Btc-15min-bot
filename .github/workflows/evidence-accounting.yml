name: Evidence accounting
on:
  pull_request:
    paths:
      - 'completion_audit/**'
      - '.github/workflows/evidence-accounting.yml'
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s completion_audit -p 'test_*.py' -v
