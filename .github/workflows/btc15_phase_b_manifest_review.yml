name: BTC15 Phase B manifest review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate protected files and generate isolated candidate manifest
        run: |
          python prepare_btc15_early_release_review.py
          python verify_btc15_early_release_candidate.py
      - name: Verify committed release, startup authorization and journal restart
        env:
          BTC15_DATA_DIR: ${{ runner.temp }}/btc15-phase-b-data
        run: python -B -m unittest -v test_btc15_phase_b_release test_btc15_infrastructure_repair test_btc15_fair_startup_recovery test_btc15_live_delivery_repair
      - name: Verify cockpit package checksums
        working-directory: cockpit_candidate
        run: sha256sum --check hosting/runtime.sha256
      - name: Inspect manifest candidate without authorizing deployment
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          p=root/'qualification/early-release-review/BTC15_V2_PRODUCT_RELEASE_R1.candidate.json'
          candidate=json.loads(p.read_text())
          original=json.loads((root/'BTC15_V2_PRODUCT_RELEASE_R1.json').read_text())
          assert candidate['orders'] is False
          assert candidate['signal_only'] is True
          assert candidate['manual_execution_only'] is True
          assert p.read_bytes()==(root/'BTC15_V2_PRODUCT_RELEASE_R1.json').read_bytes()
          assert candidate['lane_protected_files']==original['lane_protected_files']
          for name,sha in candidate['files_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          print('PASS: candidate manifest hashes, protected files, signal-only, no orders')
          print('Candidate manifest SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btc15-phase-b-manifest-review-only
          path: qualification/early-release-review/
# Verifies committed release bytes. Never supplies production authorization.
