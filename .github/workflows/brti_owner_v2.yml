name: BRTI owner source integrity
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 cryptography==50.0.0
      - run: python -m unittest test_brti_shared_owner_v2 -v
