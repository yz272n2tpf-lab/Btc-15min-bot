name: Scalp UI state contract V1 tests

on:
  push:
    branches: [scalp-ui-state-contract-v1]
    paths:
      - 'btc15_scalp_ui_state_contract_v1.py'
      - 'btc15_scalp_ui_state_shadow_v1.py'
      - 'btc15_scalp_ui_state_fixtures_v1.py'
      - 'btc15_scalp_ui_transition_guard_v1.py'
      - 'btc15_mobile_dashboard_view_model_v1.py'
      - 'btc15_mobile_dashboard_view_model_v2.py'
      - 'btc15_mobile_dashboard_view_model_v3.py'
      - 'btc15_mobile_dashboard_view_model_v4.py'
      - 'btc15_mobile_dashboard_view_model_v5.py'
      - 'btc15_time_left_guardrail_v1.py'
      - 'btc15_dashboard_rollover_guard_v1.py'
      - 'btc15_scalp_memory_guard_v1.py'
      - 'btc15_manual_entry_context_guard_v1.py'
      - 'btc15_dashboard_visual_stability_guard_v1.py'
      - 'btc15_dashboard_reason_slot_guard_v1.py'
      - 'test_btc15_scalp_ui_state_contract_v1.py'
      - 'test_btc15_scalp_ui_state_contract_v1_integration.py'
      - 'test_btc15_scalp_ui_state_shadow_v1.py'
      - 'test_btc15_scalp_ui_state_fixtures_v1.py'
      - 'test_btc15_scalp_ui_transition_guard_v1.py'
      - 'test_btc15_mobile_dashboard_view_model_v1.py'
      - 'test_btc15_mobile_dashboard_view_model_v2.py'
      - 'test_btc15_mobile_dashboard_view_model_v3.py'
      - 'test_btc15_mobile_dashboard_view_model_v4.py'
      - 'test_btc15_mobile_dashboard_view_model_v5.py'
      - 'test_btc15_time_left_guardrail_v1.py'
      - 'test_btc15_dashboard_rollover_guard_v1.py'
      - 'test_btc15_scalp_memory_guard_v1.py'
      - 'test_btc15_manual_entry_context_guard_v1.py'
      - 'test_btc15_dashboard_visual_stability_guard_v1.py'
      - 'test_btc15_dashboard_reason_slot_guard_v1.py'
      - 'BTC15_SCALP_UI_STATE_CONTRACT_V1.md'
      - 'BTC15_MOBILE_DASHBOARD_LAYOUT_CONTRACT_V1.md'
      - 'BTC15_APP_LANGUAGE_CONTRACT_V1.md'
      - 'BTC15_APP_LANGUAGE_CLEANUP_SPEC_V1.md'
      - '.github/workflows/scalp-ui-state-contract-v1-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP dependency
        run: python -m pip install requests==2.32.5
      - name: Run scalp UI contract tests
        run: |
          python -m unittest -v test_btc15_scalp_ui_state_contract_v1.py
          python -m unittest -v test_btc15_scalp_ui_state_contract_v1_integration.py
          python -m unittest -v test_btc15_scalp_ui_state_shadow_v1.py
          python -m unittest -v test_btc15_scalp_ui_state_fixtures_v1.py
          python -m unittest -v test_btc15_scalp_ui_transition_guard_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v1.py
          python -m unittest -v test_btc15_time_left_guardrail_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v2.py
          python -m unittest -v test_btc15_dashboard_rollover_guard_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v3.py
          python -m unittest -v test_btc15_scalp_memory_guard_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v4.py
          python -m unittest -v test_btc15_manual_entry_context_guard_v1.py
          python -m unittest -v test_btc15_mobile_dashboard_view_model_v5.py
          python -m unittest -v test_btc15_dashboard_visual_stability_guard_v1.py
          python -m unittest -v test_btc15_dashboard_reason_slot_guard_v1.py
